<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>Details will be displayed here</h1>
<a href="" class="backBtn" ><button >Back</button> </a>

    <div class="countryDetail">
        

    </div>
    
</body>
<script>
    let backBtn = document.querySelector(".backBtn")
    backBtn.addEventListener("click", ()=>{
        const location = document.referrer;
        
        backBtn.href= location
         
    })
    let url = new URL(window.location.href)
    // const searchParams = new URL(url).searchParams
    // console.log(searchParams)


    let details = document.querySelector(".countryDetail")
    console.log(url.searchParams.get("name"))
    let country = url.searchParams.get("name")
    fetch("./data.json")
    .then((response)=> response.json())
    .then((data)=>{
        data.forEach((element)=>{
            if(element.name == country){
                details.innerHTML = ""
                console.log(element)
                let languages = ""

                element.languages.forEach((val,i)=>{
                    // console.log("hello")
                    languages+= " " + val.name
                })



                let isBorders = element.borders
                let borderDetail = ""
                let boundary =[]
                let free = element?.borders
                free?.forEach((elem)=>{
                    data.forEach((value)=>{
                        if(value.alpha3Code == elem){
                            boundary.push(value.name)
                        }
                    })
                })
                console.log(boundary)
                 boundary.forEach(value =>{
                    // console.log(value)
                    const url = "http://127.0.0.1:5500/info.html?"
   const obj = {
    name: value
   }
   const searchParams = new URLSearchParams(obj)
    let query = searchParams.toString()
    local = url+ query
                    borderDetail +=  `<a href= ${local}><button class= borderCountry>${value} </button ><a>`
                })
            let borders = isBorders? `<div>${borderDetail}</div>` :"No border countries"


                details.innerHTML = `<div>
            <img src=${element.flags.svg} alt=${element.name} >
            <h1>${element.name}</h1>
            <p>Native Name: ${element.nativeName}</p>
            <p>Population: ${element.population}</p>
            <p>Region: ${element.region}</p>
            <p>Sub Region:${element.subregion}</p>
            <p>Capital:${element.capital}</p>
            <p>Top level Domain: ${element.topLevelDomain}</p>
            <p>Currencies:${element.currencies[0].name}</p>
            <p>Languages:${languages}</p>
            <h3>Border Countries</h3>
            ${borders}
            
            
        </div>`
            }
        })
    })



</script>
</html>
